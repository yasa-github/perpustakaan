{% extends "base.html" %}
{% block title %}Daftar Peminjam - Pustaka Hijau{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white p-8 rounded-2xl shadow-sm border border-emerald-100">
  <h2 class="text-2xl font-bold text-emerald-900 mb-2 text-center">Registrasi Peminjam</h2>
  <p class="text-sm text-slate-500 mb-6 text-center">Daftarkan akun anggota untuk mulai meminjam koleksi buku</p>

  <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap</label>
      <input type="text" name="full_name" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
      <input type="text" name="username" required placeholder="budi123" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi</label>
      <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
    </div>
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow mt-2">
      Daftar Sebagai Anggota
    </button>
  </form>

  <p class="mt-6 text-center text-xs text-slate-600">
    Sudah terdaftar? <a href="{{ url_for('login') }}" class="text-emerald-700 font-semibold hover:underline">Masuk ke akun</a>
  </p>
</div>
{% endblock %}
